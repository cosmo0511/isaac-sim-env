# 팀 공통 커스텀 이미지 빌드 → GHCR 푸시
#
# 평소에는 불필요합니다. nvcr.io/nvidia/isaac-lab:2.3.1 을 직접 쓰세요.
# Dockerfile 에 팀 공통 패키지를 추가했을 때만 사용합니다.
name: Build Isaac Lab image

on:
  push:
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/isaac-lab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 베이스 이미지가 압축 7.8GB 입니다. 기본 러너 디스크로는 빠듯해서
      # 쓰지 않는 사전설치 툴체인을 먼저 비웁니다.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:2.3.1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image reference
        run: |
          echo "AIEEV 컨테이너 이미지 URL 에 아래 값을 입력하세요:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:2.3.1"
          echo "패키지를 public 으로 바꾸면 레지스트리 인증이 필요 없습니다."
